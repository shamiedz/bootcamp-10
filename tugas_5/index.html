<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce Catalog - JavaScript Looping & Filter</title>

  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Google Font: Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-color: #f86f03;
      --primary-hover: #e05e00;
      --dark-color: #212529;
      --muted-color: #6c757d;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f8f9fa;
      color: var(--dark-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navbar */
    .navbar-brand {
      font-weight: 700;
      font-size: 22px;
      letter-spacing: 0.5px;
    }
    .navbar-brand span {
      color: var(--primary-color);
    }

    /* Header Banner */
    .catalog-header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #ffffff;
      padding: 50px 0 40px;
      margin-bottom: 35px;
    }
    .catalog-header h1 {
      font-weight: 700;
      font-size: 32px;
    }
    .catalog-header p {
      color: #94a3b8;
      font-size: 15px;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Filter Buttons */
    .filter-wrapper {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 35px;
    }
    .btn-filter {
      border: 1.5px solid #dee2e6;
      background-color: #ffffff;
      color: #495057;
      padding: 8px 22px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.25s ease;
      cursor: pointer;
    }
    .btn-filter:hover {
      border-color: var(--primary-color);
      color: var(--primary-color);
      transform: translateY(-2px);
    }
    .btn-filter.active {
      background-color: var(--primary-color);
      border-color: var(--primary-color);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(248, 111, 3, 0.3);
    }

    /* Product Card */
    .product-card {
      border: 1px solid #e9ecef;
      border-radius: 12px;
      background: #ffffff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100%;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .product-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08);
    }
    .product-img-box {
      width: 100%;
      height: 210px;
      overflow: hidden;
      background-color: #f1f3f5;
      position: relative;
    }
    .product-img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.35s ease;
    }
    .product-card:hover .product-img-box img {
      transform: scale(1.06);
    }
    .badge-category {
      position: absolute;
      top: 12px;
      left: 12px;
      background-color: rgba(30, 41, 59, 0.85);
      color: #ffffff;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }
    .product-body {
      padding: 18px 20px 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .product-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #1e293b;
    }
    .product-desc {
      font-size: 13px;
      color: var(--muted-color);
      line-height: 1.6;
      margin-bottom: 16px;
      flex-grow: 1;
    }
    .product-price {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary-color);
      margin-bottom: 14px;
    }
    .btn-buy {
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 16px;
      border-radius: 8px;
      width: 100%;
      transition: all 0.2s ease;
    }
    .btn-buy:hover {
      background-color: var(--primary-hover);
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(248, 111, 3, 0.3);
    }

    /* Empty State */
    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: var(--muted-color);
    }
    .empty-state i {
      font-size: 48px;
      margin-bottom: 12px;
      color: #cbd5e1;
    }

    footer {
      background-color: #ffffff;
      border-top: 1px solid #dee2e6;
      padding: 20px 0;
      margin-top: auto;
      font-size: 13px;
      color: var(--muted-color);
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top py-3">
    <div class="container">
      <a class="navbar-brand" href="#">STORE<span>PEDIA</span></a>
      <div class="d-flex align-items-center gap-3">
        <span class="badge bg-light text-dark border px-3 py-2">
          <i class="bi bi-cart3 me-1 text-warning"></i>
          <span id="product-count">0</span> Produk Tersedia
        </span>
      </div>
    </div>
  </nav>

  <!-- Banner Header -->
  <header class="catalog-header text-center">
    <div class="container">
      <h1>Katalog Produk Pilihan</h1>
      <p>Data produk di-generate dinamis menggunakan perulangan JavaScript dan dilengkapi fitur filter kategori.</p>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container mb-5">
    <!-- Filter Kategori (Requirement 2) -->
    <div class="filter-wrapper" id="filter-buttons">
      <button class="btn-filter active" onclick="filterByCategory('all', this)">Semua</button>
      <button class="btn-filter" onclick="filterByCategory('elektronik', this)">Elektronik</button>
      <button class="btn-filter" onclick="filterByCategory('fashion', this)">Fashion</button>
      <button class="btn-filter" onclick="filterByCategory('aksesoris', this)">Aksesoris</button>
      <button class="btn-filter" onclick="filterByCategory('perabotan', this)">Perabotan</button>
    </div>

    <!-- Container Grid Produk (Requirement 1b) -->
    <div class="row g-4" id="product-container">
      <!-- Item produk akan disuntikkan ke sini oleh JavaScript -->
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="container">
      &copy; 2026 Dhimas Novergust. Tugas E-Commerce Dynamic Products & Filtering.
    </div>
  </footer>

  <!-- Toast Notifikasi Tambah Keranjang -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;">
    <div id="cartToast" class="toast align-items-center text-bg-dark border-0 shadow" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body d-flex align-items-center gap-2">
          <i class="bi bi-check-circle-fill text-warning fs-5"></i>
          <span id="toastMessage">Produk dimasukkan ke keranjang.</span>
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Logika JavaScript (Array, Looping & Filtering) -->
  <script>
    // -------------------------------------------------------------
    // REQUIREMENT 1.a: Array Data Produk
    // Berisi: nama, harga, deskripsi, gambar, serta kategori
    // -------------------------------------------------------------
    const products = [
      {
        id: 1,
        nama: "Wireless Noise-Canceling Headphone",
        kategori: "elektronik",
        harga: 1450000,
        deskripsi: "Headphone over-ear nirkabel dengan isolasi suara aktif dan daya tahan baterai hingga 30 jam.",
        gambar: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600&auto=format&fit=crop&q=80"
      },
      {
        id: 2,
        nama: "Smartwatch AMOLED Pro Series",
        kategori: "elektronik",
        harga: 2199000,
        deskripsi: "Jam tangan pintar dengan sensor detak jantung, GPS akurat, dan ketahanan air hingga 50 meter.",
        gambar: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600&auto=format&fit=crop&q=80"
      },
      {
        id: 3,
        nama: "Jaket Parka Outdoor Anti-Air",
        kategori: "fashion",
        harga: 485000,
        deskripsi: "Jaket windproof dan waterproof berbahan taslan tebal, sangat nyaman dipakai untuk trekking.",
        gambar: "https://images.unsplash.com/photo-1551028719-00167b16eac5?w=600&auto=format&fit=crop&q=80"
      },
      {
        id: 4,
        nama: "Sneakers Classic Minimalist",
        kategori: "fashion",
        harga: 650000,
        deskripsi: "Sepatu kanvas premium dengan insole empuk ortotik, ideal dipakai bekerja maupun kasual harian.",
        gambar: "https://images.unsplash.com/photo-1549298916-b41d501d3772?w=600&auto=format&fit=crop&q=80"
      },
      {
        id: 5,
        nama: "Kacamata Polarized Matte Black",
        kategori: "aksesoris",
        harga: 235000,
        deskripsi: "Lensa UV400 polarized dengan frame polikarbonat ultra-ringan yang kokoh dan anti-silau.",
        gambar: "https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=600&auto=format&fit=crop&q=80"
      },
      {
        id: 6,
        nama: "Tas Ransel Laptop Travel 20L",
        kategori: "aksesoris",
        harga: 375000,
        deskripsi: "Backpack ergonomis dengan kompartemen laptop 15.6 inci, port USB eksternal, dan material tahan gores.",
        gambar: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=600&auto=format&fit=crop&q=80"
      },
      {
        id: 7,
        nama: "Lampu Meja LED Nordic Minimalis",
        kategori: "perabotan",
        harga: 320000,
        deskripsi: "Lampu belajar estetik dengan 3 mode temperatur cahaya dan kontrol sentuh pengaturan intensitas redup.",
        gambar: "https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=600&auto=format&fit=crop&q=80"
      },
      {
        id: 8,
        nama: "Keyboard Mekanikal Wireless 75%",
        kategori: "elektronik",
        harga: 890000,
        deskripsi: "Hot-swappable tactile switch keyboard dengan lampu latar RGB serta konektivitas Bluetooth 5.0 ganda.",
        gambar: "https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=600&auto=format&fit=crop&q=80"
      },
      {
        id: 9,
        nama: "Mouse Wireless Ergonomis",
        kategori: "elektronik",
        harga: 250000,
        deskripsi: "Mouse tanpa kabel dengan desain vertikal ergonomis anti-pegal.",
        gambar: "https://images.unsplash.com/photo-1527864550417-7fd91fc51a46?w=600&auto=format&fit=crop&q=80"
      },
    ];

    // Helper: Format angka menjadi format mata uang Rupiah
    function formatRupiah(number) {
      return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        maximumFractionDigits: 0
      }).format(number);
    }

    // -------------------------------------------------------------
    // REQUIREMENT 1.b: Menampilkan Produk dengan Looping JavaScript
    // -------------------------------------------------------------
    const container = document.getElementById('product-container');
    const productCountEl = document.getElementById('product-count');

    function renderProducts(items) {
      // Kosongkan kontainer sebelum melakukan render ulang
      container.innerHTML = '';
      productCountEl.innerText = items.length;

      // Jika data filter kosong
      if (items.length === 0) {
        container.innerHTML = `
          <div class="col-12">
            <div class="empty-state">
              <i class="bi bi-inbox d-block"></i>
              <h5 class="fw-bold">Tidak ada produk ditemukan</h5>
              <p class="text-muted small">Coba pilih kategori lain pada menu filter di atas.</p>
            </div>
          </div>
        `;
        return;
      }

      // Looping data array produk menggunakan forEach
      items.forEach(product => {
        const col = document.createElement('div');
        col.className = 'col-lg-3 col-md-4 col-sm-6';

        col.innerHTML = `
          <div class="product-card">
            <div class="product-img-box">
              <span class="badge-category">${product.kategori.toUpperCase()}</span>
              <img src="${product.gambar}" alt="${product.nama}" loading="lazy">
            </div>
            <div class="product-body">
              <h3 class="product-title">${product.nama}</h3>
              <p class="product-desc">${product.deskripsi}</p>
              <div class="product-price">${formatRupiah(product.harga)}</div>
              <button class="btn btn-buy" onclick="handleAddToCart('${product.nama}')">
                <i class="bi bi-cart-plus me-1"></i> Beli Sekarang
              </button>
            </div>
          </div>
        `;

        container.appendChild(col);
      });
    }

    // -------------------------------------------------------------
    // REQUIREMENT 2: Fitur Filter Kategori Sederhana
    // -------------------------------------------------------------
    function filterByCategory(selectedCategory, clickedButton) {
      // 1. Perbarui status tombol aktif
      const allButtons = document.querySelectorAll('.btn-filter');
      allButtons.forEach(btn => btn.classList.remove('active'));
      if (clickedButton) {
        clickedButton.classList.add('active');
      }

      // 2. Filter data array berdasarkan kategori
      if (selectedCategory === 'all') {
        renderProducts(products);
      } else {
        const filteredList = products.filter(item => item.kategori.toLowerCase() === selectedCategory.toLowerCase());
        renderProducts(filteredList);
      }
    }

    // Feedback interaktif saat tombol beli diklik
    function handleAddToCart(productName) {
      const toastEl = document.getElementById('cartToast');
      const toastMessage = document.getElementById('toastMessage');
      toastMessage.innerText = `"${productName}" berhasil ditambahkan!`;
      const toast = new bootstrap.Toast(toastEl);
      toast.show();
    }

    // Inisialisasi awal: Muat seluruh produk saat halaman pertama kali dibuka
    document.addEventListener('DOMContentLoaded', () => {
      renderProducts(products);
    });
  </script>
</body>
</html>
